<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biglietto da Visita - Stefano Marciante</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f6f8fa;
            color: #24292f;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            text-align: center;
            box-sizing: border-box;
            margin: 20px;
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 4px solid #0969da;
        }
        h1 { margin: 0; font-size: 26px; font-weight: 700; }
        p.title { color: #57606a; font-size: 16px; margin-top: 5px; font-weight: 500; }
        p.bio { font-size: 15px; margin: 25px 0; line-height: 1.6; color: #57606a; }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }
        .btn-primary { background: #0969da; color: white; border: none; }
        .btn-primary:hover { background: #0550ae; transform: translateY(-2px); }
        .btn-github { background: #24292f; color: white; }
        .btn-github:hover { background: #1c2128; transform: translateY(-2px); }
        .btn-outline { background: transparent; border: 2px solid #d0d7de; color: #24292f; }
        .btn-outline:hover { border-color: #8c959f; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="card">
        <!-- Percorso relativo alla tua foto -->
        <img src="stefano-marciante.png" alt="Foto Profilo Stefano Marciante" class="profile-img">
        
        <h1>Stefano Marciante</h1>
        <p class="title">Executive Chef / Software Engineer</p>
        <p class="bio">Ciao! Sono un Executive Chef appassionato e uno sviluppatore di software. Dai un'occhiata ai miei progetti o salvami in rubrica per restare in contatto.</p>
        
        <a href="contatto.vcf" class="btn btn-primary" download>📥 Salva in Rubrica</a>
        <a href="https://github.com/stefanomarciante" class="btn btn-github">🐙 Visita il mio GitHub</a>
        <a href="mailto:stefano.marciante.sm@gmail.com" class="btn btn-outline">✉️ Scrivimi un'email</a>
    </div>
</body>
</html>
